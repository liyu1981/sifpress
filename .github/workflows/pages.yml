name: Pages

# Publishes the static project website in website/ to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - name: Validate local references
        run: |
          cd website
          for f in assets/site.css assets/site.js assets/fonts/geist-latin-wght-normal.woff2; do
            test -s "$f" || { echo "::error::missing $f"; exit 1; }
          done

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
